<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">compress-img.sh</title>
  <desc id="d">Logo: an image card being squeezed by two arrows, next to the name compress-img.sh</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <clipPath id="card"><rect x="78" y="55" width="130" height="130" rx="22"/></clipPath>
  </defs>
  <rect width="820" height="240" rx="28" fill="url(#bg)"/>

  <!-- compression arrows -->
  <path d="M28 98 L58 120 L28 142" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M258 98 L228 120 L258 142" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- image card -->
  <rect x="78" y="55" width="130" height="130" rx="22" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <g clip-path="url(#card)">
    <circle cx="122" cy="98" r="13" fill="#fbbf24"/>
    <polygon points="70,190 122,124 154,160 176,134 216,190" fill="#34d399"/>
    <polygon points="150,190 176,134 216,190" fill="#059669"/>
  </g>

  <!-- wordmark -->
  <text x="300" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="48" font-weight="700" fill="#f8fafc">compress-img<tspan fill="#34d399">.sh</tspan></text>
  <text x="302" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="21" fill="#94a3b8">Batch-compress PNG · JPG · WebP in parallel</text>

  <!-- command pill -->
  <rect x="300" y="172" width="350" height="36" rx="10" fill="#0b1220" stroke="#334155"/>
  <text x="316" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" fill="#38bdf8">$ ./compress-img.sh -m 2 ./photos</text>
</svg>
